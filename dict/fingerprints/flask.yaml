id: flask
info:
  name: Flask
  author: 28zenro
  tags: detect,tech,flask,python,framework
  severity: info
  metadata:
    product: flask
    vendor: pallets
    verified: true
http:
  - method: GET
    path:
      - '/'
    matchers:
      - type: word
        words:
          - server: werkzeug
        part: header
        case-insensitive: true
