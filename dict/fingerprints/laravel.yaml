id: laravel
info:
  name: Laravel
  author: 28zenro
  tags: detect,tech,laravel,php,framework
  severity: info
  metadata:
    product: laravel
    vendor: laravel
    verified: true
http:
  - method: GET
    path:
      - '/'
    matchers:
      - type: word
        words:
          - laravel_session
        part: header
        case-insensitive: true
      - type: word
        words:
          - x-powered-by: laravel
        part: header
        case-insensitive: true
      - type: word
        words:
          - laravel
        part: body
        case-insensitive: true
