id: nginx
info:
  name: Nginx
  author: 28zenro
  tags: detect,tech,nginx,webserver
  severity: info
  metadata:
    product: nginx
    vendor: nginx
    verified: true
http:
  - method: GET
    path:
      - '/'
    matchers:
      - type: regex
        regex:
          - (?i)server:\s*nginx(?:/([\d.]+))?
        part: header
    extractors:
      - name: version
        type: regex
        regex:
          - (?i)server:\s*nginx(?:/([\d.]+))?
