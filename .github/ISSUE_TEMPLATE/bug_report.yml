name: 🐛 Bug 报告
description: 报告一个 bug（崩溃、异常、结果错误、界面问题等）
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题！提交前请先确认：
        - 已搜索 [已有 Issue](https://code.lvlv.asia/28.7/cipherNest/issues)，避免重复；
        - 已阅读 [README](HUMAN_README.md) 与 [常见问题](#)；
        - 尽量提供**可复现**的信息，这能极大加快定位速度。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 用一句话 + 详细说明发生了什么，以及你期望的正确行为是什么。
      placeholder: |
        例如：使用 base64 解码时，输入 `aGVsbG8=` 点「解码」后程序直接闪退。
        期望：应输出 `hello`。
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: 涉及的功能 / 工具
      description: 问题出现在哪个工具或模块？
      options:
        - 编解码（Base / ROT / 进制）
        - 哈希 / 国密
        - 密码 Fuzz
        - 字符加解密 / 古典密码
        - JWT
        - 图片工具 / 隐写
        - 压缩包工具
        - Web 信息收集 / 扫描
        - 思维导图 / Markdown 编辑
        - MCP 服务
        - 界面 / 主题 / 导航
        - 其他（请在描述里说明）

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 尽量给出可复现的最小步骤，越具体越好。
      placeholder: |
        1. 打开「XX 工具」
        2. 输入 …
        3. 点击「…」
        4. 观察到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: 拖拽图片到此处即可上传。报错弹窗、界面异常截图很有帮助。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 在「关于」页 / 程序标题栏可查看版本。也可是 git 提交号。
      placeholder: "例如：1.27.2"

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 系统名称与版本。
      placeholder: "例如：Windows 10 22H2 / Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本（如从源码运行）
      description: 仅当你从源码运行时需要；使用打包版可留空。
      placeholder: "例如：3.12.4"

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: 粘贴控制台输出、traceback 或 MCP 服务日志。请用代码块包裹。
      render: shell

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何其他有助于定位的上下文（复现概率、是否打包版、是否联网等）。
