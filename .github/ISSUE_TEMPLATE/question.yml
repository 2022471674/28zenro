name: ❓ 提问 / 其他
description: 提出一个使用问题或不属于 bug / 功能请求的问题
title: "[Question] "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        如果只是使用上的疑问，建议先看 [README](HUMAN_README.md) 和搜索 [已有 Issue](https://code.lvlv.asia/28.7/28zenro/issues)。
        涉及想法交流、经验分享的问题更适合在仓库讨论区讨论。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 请描述清楚背景、你已经尝试过什么、卡在哪里。
      placeholder: |
        例如：我想把 MCP 服务暴露给局域网内的另一台机器调用，
        但改成 0.0.0.0 后客户端连不上，可能是什么原因？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 可选，但有助于判断。
      placeholder: "例如：1.27.2"

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "例如：Windows 11 23H2"

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、日志、相关配置等。
