name: ✨ 功能请求
description: 建议一个新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！提交前请先搜索 [已有 Issue](https://code.lvlv.asia/28.7/cipherNest/issues)，
        确认没有重复。请尽量描述清楚**要解决什么问题**，而不只是罗列功能点。

  - type: textarea
    id: problem
    attributes:
      label: 这个功能要解决的问题
      description: 描述你遇到的痛点或场景，让维护者理解背后的动机。
      placeholder: |
        例如：现在做 CTF 题时，经常需要同时对比多个 Base 编码的结果，
        但每次只能单独解码一个，来回切换很麻烦。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望它如何工作？有 UI 草图或交互说明更好。
      placeholder: |
        例如：希望「密码 Fuzz」页支持批量输入多行密文，一次跑完所有解码器，
        结果以表格展示并支持导出。

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有其他能部分满足需求的办法？为什么不够好？

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 新增独立工具
        - 改进现有工具
        - 界面 / 交互优化
        - MCP 服务
        - 打包 / 安装
        - 文档 / 模板

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 参考链接、类似工具的做法、截图等。
